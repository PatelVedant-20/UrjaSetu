# UrjaSetu Alembic configuration.
#
# NOTE: `sqlalchemy.url` is intentionally absent. The URL is supplied at runtime
# by alembic/env.py from app.core.config, so migrations and the application can
# never point at different databases, and no credentials live in a tracked file.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Migration filenames sort chronologically and read clearly in `git log`.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
